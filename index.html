<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Who Broke My Trunk?</title>
  <style>
    body { margin:0; overflow:hidden; background:#a8d0e6; }
    canvas { display:block; margin:auto; background:#fefefe; border:2px solid #333; }
    #gameOver { position:absolute; top:0; left:0; width:100%; height:100%; display:none;
      background:rgba(0,0,0,0.7); color:white; font:24px sans-serif;
      justify-content:center; align-items:center; flex-direction:column;
    }
    #gameOver button { margin-top:20px; padding:10px 20px; font:18px sans-serif; }
  </style>
</head>
<body>
  <canvas id="c" width="600" height="800"></canvas>
  <div id="gameOver">
    <div id="finalScore"></div>
    <button id="restart">Restart</button>
  </div>
  <script>
  const ctx = document.getElementById('c').getContext('2d');
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const blockW = 100, blockH = 100;
  const trunkY = H - blockH;
  const images = ['rhino','turtle','rabbit','flamingo','hippo','penguin']
    .reduce((o,k)=>(o[k]=new Image(),o),{});
  images.rhino.src='rhino.png'; images.turtle.src='turtle.png'; images.rabbit.src='rabbit.png';
  images.flamingo.src='flamingo.png'; images.hippo.src='hippo.png'; images.penguin.src='penguin.png';
  const geraldImage = new Image();
  geraldImage.src = 'gerald.png';
  // Background image
  const bgImage = new Image();
  bgImage.src = 'background.png';
  // Parallax scroll factor for the background (0=no scroll, 1=sync with camera)
  const parallaxFactor = 0.5;
  
  let geraldX = (W-blockW)/2, speed=0, stack=[]; let lives=3, score=0, gameOver=false;
  let current = null;
  let cameraY = 0;

  let endAnimating = false;
  let endAnimProgress = 0;
  const endAnimDuration = 120; // frames for the scroll-down
  let initialCameraY = 0;

  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft') speed=-8; if(e.key==='ArrowRight') speed=8;
  });
  document.addEventListener('keyup', e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight') speed=0; });

  function spawn(){
    const types = ['rhino','turtle','rabbit','flamingo','hippo','penguin'];
    const type = types[Math.floor(Math.random()*types.length)];
    const randomX = Math.random() * (W - blockW);
    // Always start new animals just above the top edge of the screen
    current = { x: randomX, y: -blockH - cameraY, type, img:images[type] };
  }

  function update(){
    if(gameOver) return;
    geraldX = Math.min(Math.max(geraldX+speed,0), W-blockW);
    if(current){
      current.y += 4;
      const targetY = trunkY - blockH * stack.length;
      // check landing: bottom of block meets targetY
      if (current.y + blockH >= targetY) {
        // check alignment
        if(Math.abs(current.x - (stack.length?geraldX + stack[stack.length-1].dx:geraldX)) < blockW/2){
          // caught
          // snap so bottom of block rests on targetY
          current.y = targetY - blockH;
          stack.push({ img: current.img, dx: current.x - geraldX });
          score = stack.length;
          spawn();
        } else {
          // miss
          lives--;
          if(lives>0) spawn(); else end();
        }
      }
    }
    // Pan camera according to stack height
    cameraY = blockH * stack.length;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // Draw scrolling background slice anchored to image bottom
    if (bgImage.complete) {
      // Compute source Y so bottom of image aligns initially,
      // then scroll up by cameraY*parallaxFactor
      let srcY = Math.floor((bgImage.height - H) - cameraY * parallaxFactor);
      // Clamp within valid range
      srcY = Math.max(0, Math.min(srcY, bgImage.height - H));
      // Draw the H-high slice from srcY
      ctx.drawImage(
        bgImage,
        0, srcY,
        bgImage.width, H,
        0, 0,
        W, H
      );
    }
    ctx.save();
    ctx.translate(0, cameraY);
    // draw full stack of animals
    stack.forEach((b,i)=>{
      ctx.drawImage(b.img, geraldX + b.dx, trunkY - blockH*(i+1), blockW, blockH);
    });
    // draw current falling
    if(current && current.img.complete){
      ctx.drawImage(current.img, current.x, current.y, blockW, blockH);
    }
    // draw Gerald
    if (geraldImage.complete) {
      ctx.drawImage(geraldImage, geraldX, trunkY, blockW, blockH);
    } else {
      ctx.fillStyle='gray';
      ctx.fillRect(geraldX, trunkY, blockW, blockH);
    }
    ctx.restore();
    // UI
    ctx.fillStyle='black'; ctx.font='20px sans-serif';
    ctx.fillText('Lives:'+lives,10,30); ctx.fillText('Score:'+score,10,60);
  }

  function loop(){
    if (endAnimating) {
      endAnimProgress++;
      // animate cameraY from initialCameraY down to 0
      cameraY = initialCameraY * (1 - endAnimProgress / endAnimDuration);
      if (endAnimProgress >= endAnimDuration) {
        endAnimating = false;
        cameraY = 0;
        // show overlay after animation
        document.getElementById('finalScore').innerText = 'Final Score: ' + score;
        document.getElementById('gameOver').style.display = 'flex';
        return;
      }
      // draw current frame, then queue next
      draw();
      requestAnimationFrame(loop);
      return;
    }
    update(); draw();
    if(!gameOver) requestAnimationFrame(loop);
  }
  function end(){
    gameOver = true;
    // Prepare scroll-down animation
    endAnimating = true;
    endAnimProgress = 0;
    initialCameraY = cameraY;
  }
  document.getElementById('restart').onclick=()=>{
    stack=[]; lives=3; score=0; gameOver=false; spawn(); loop();
    document.getElementById('gameOver').style.display='none';
  };

  // start
  spawn(); loop();
  </script>
</body>
</html>
